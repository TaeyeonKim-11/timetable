<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 시간표</title>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/namuwiki/nanum-gothic@latest/NanumGothic.css');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: "Nanum Gothic", sans-serif;
            background-color: #eaf6ff;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #3b6f91;
        }

        table {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            border-collapse: collapse;
            table-layout: fixed;
            background-color: white;
        }

        th, td {
            border: 1px solid #a9c9dc;
            text-align: center;
            padding: 15px;
        }

        th {
            background-color: #b9ddf2;
            color: #31566d;
            font-size: 17px;
        }

        td {
            height: 80px;
            font-size: 14px;
        }

        .time {
            width: 120px;
            background-color: #d9effc;
            font-weight: bold;
            color: #47718a;
        }

        .class {
            background-color: #cfeaff;
            font-weight: bold;
            color: #31566d;
        }

        .empty {
            background-color: #f8fcff;
        }
    </style>
</head>

<body>

    <h1>나의 시간표</h1>

    <table>
        <tr>
            <th>시간</th>
            <th>월요일</th>
            <th>화요일</th>
            <th>수요일</th>
            <th>목요일</th>
            <th>금요일</th>
        </tr>

        <tr>
            <td class="time">09:00 ~ 10:00</td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="class" rowspan="3">컴퓨팅 사고:<br>Python 프로그래밍</td>
            <td class="empty"></td>
        </tr>

        <tr>
            <td class="time">10:00 ~ 11:00</td>
            <td class="class" rowspan="3">사고와 표현</td>
            <td class="class" rowspan="3">소자제작실습1</td>
            <td class="class">채플</td>
            <td class="empty"></td>
        </tr>

        <tr>
            <td class="time">11:00 ~ 12:00</td>
            <td class="class" rowspan="4">
                AI반도체특허출원실습II<br>
                (캡스톤디자인)
            </td>
            <td class="empty"></td>
        </tr>

        <tr>
            <td class="time">12:00 ~ 13:00</td>
            <td class="empty"></td>
            <td class="empty"></td>
        </tr>

        <tr>
            <td class="time">13:00 ~ 14:00</td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
        </tr>

        <tr>
            <td class="time">14:00 ~ 15:00</td>
            <td class="class" rowspan="3">인공지능 반도체 개론</td>
            <td class="class" rowspan="3">웹프로그래밍</td>
            <td class="empty"></td>
            <td class="empty"></td>
        </tr>

        <tr>
            <td class="time">15:00 ~ 16:00</td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
        </tr>

        <tr>
            <td class="time">16:00 ~ 17:00</td>
            <td class="empty"></td>
            <td class="empty"></td>
            <td class="empty"></td>
        </tr>
    </table>

</body>
</html>
